<!doctype html><html><head><meta charset="utf-8"><title>Buildings</title>
<style>body{background:#1a1622;color:#ddd;font:14px system-ui;padding:8px;margin:0} canvas{image-rendering:pixelated;display:block} .row{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 6px}</style></head>
<body>
<div class="row" id="btns"></div>
<canvas id="scene"></canvas>
<script>window.G = {};</script>
<script src="../js/art/gothic.js"></script>
<script src="../js/world/buildings.js"></script>
<script>
const S = 4, LW = +((location.hash.match(/w=(\d+)/) || [])[1] || 390);
let night = location.hash.includes('night'), only = (location.hash.match(/only=([\w,:]+)/) || [])[1];
const ids = only ? only.split(',') : Object.keys(G.BUILDINGS).concat(Object.keys(G.RUINS).map((r) => 'ruin:' + r));
const cv = document.getElementById('scene'), ctx = cv.getContext('2d');
function sprite(id) { return id.startsWith('ruin:') ? G.ruinSprite(id.slice(5)) : G.buildingSprite(id); }
function foot(id) { return id.startsWith('ruin:') ? G.RUINS[id.slice(5)].foot : G.BUILDINGS[id].foot; }
function render() {
  // lay buildings out in rows
  const W = LW, rows = []; let row = [], rw = 0;
  for (const id of ids) { const s = sprite(id); const w = Math.max(s.w, foot(id)[0] * 16) + 20; if (rw + w > W && row.length) { rows.push(row); row = []; rw = 0; } row.push([id, s, rw]); rw += w; }
  if (row.length) rows.push(row);
  const rowH = rows.map((r) => Math.max(...r.map(([, s]) => s.h)) + 40);
  const H = rowH.reduce((a, b) => a + b, 0);
  cv.width = W * S; cv.height = H * S; cv.style.width = W * S / (window.devicePixelRatio || 1) + 'px';
  const buf = document.createElement('canvas'); buf.width = W; buf.height = H; const b = buf.getContext('2d');
  b.fillStyle = '#296246'; b.fillRect(0, 0, W, H);
  for (let y = 0; y < H; y += 2) for (let x = (y / 2) % 2; x < W; x += 4) { const n = GothicArt.noise(x / 9, y / 9, 3); b.fillStyle = n < 0.4 ? '#1f4e3c' : n < 0.7 ? '#296246' : '#377a53'; b.fillRect(x, y, 2, 2); }
  const lights = []; let y0 = 0;
  rows.forEach((r, k) => {
    const base = y0 + rowH[k] - 22;
    for (const [id, s, x] of r) {
      const fw = foot(id)[0] * 16, fh = foot(id)[1] * 16, cx = x + Math.max(s.w, fw) / 2 + 10;
      b.fillStyle = 'rgba(0,0,0,0.25)'; b.fillRect(cx - fw / 2, base - fh + 1, fw, fh);
      b.drawImage(night ? s.n : s.c, Math.round(cx - s.ax), Math.round(base - s.ay));
      for (const L of s.lights) lights.push({ x: cx - s.ax + L.x, y: base - s.ay + L.y, r: L.r, c: L.color, i: L.i });
      if (s.door) { b.fillStyle = '#f2c45a'; b.fillRect(Math.round(cx - s.ax + s.door.x), base + 2, 1, 3); }
      b.fillStyle = '#fff'; b.font = '9px monospace'; b.fillText(id + ' ' + s.w + 'x' + s.h, cx - fw / 2, base + 14);
    }
    y0 += rowH[k];
  });
  ctx.imageSmoothingEnabled = false; ctx.globalCompositeOperation = 'source-over'; ctx.drawImage(buf, 0, 0, W * S, H * S);
  if (night) {
    const lc = document.createElement('canvas'); lc.width = W; lc.height = H; const l = lc.getContext('2d');
    l.fillStyle = 'rgb(70,62,130)'; l.fillRect(0, 0, W, H); l.globalCompositeOperation = 'lighter';
    for (const L of lights) { const g = l.createRadialGradient(L.x, L.y, 0, L.x, L.y, L.r); g.addColorStop(0, `rgba(${L.c},${L.i})`); g.addColorStop(0.5, `rgba(${L.c},${L.i * 0.35})`); g.addColorStop(1, `rgba(${L.c},0)`); l.fillStyle = g; l.fillRect(L.x - L.r, L.y - L.r, L.r * 2, L.r * 2); }
    ctx.globalCompositeOperation = 'multiply'; ctx.imageSmoothingEnabled = true; ctx.drawImage(lc, 0, 0, W * S, H * S);
    ctx.globalCompositeOperation = 'lighter';
    for (const L of lights) { const r = L.r * 0.5 * S; const g = ctx.createRadialGradient(L.x * S, L.y * S, 0, L.x * S, L.y * S, r); g.addColorStop(0, `rgba(${L.c},${0.25 * L.i})`); g.addColorStop(1, `rgba(${L.c},0)`); ctx.fillStyle = g; ctx.fillRect(L.x * S - r, L.y * S - r, r * 2, r * 2); }
    ctx.globalCompositeOperation = 'source-over';
  }
}
const n = document.createElement('button'); n.textContent = 'Day / Night'; n.onclick = () => { night = !night; render(); }; document.getElementById('btns').appendChild(n);
render();
</script></body></html>
