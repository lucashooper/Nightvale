<title>Nightvale Building Styles</title>
<link href="https://fonts.googleapis.com/css2?family=Jacquard+24&family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
<style>
:root { --bg: #14101f; --panel: #1f1830; --edge: #4a3b6d; --text: #efe8fb; --muted: #b1a4cf; --gold: #f2c45a; --display: 'Jacquard 24', Georgia, serif; --font: 'Pixelify Sans', 'Trebuchet MS', system-ui, sans-serif; color-scheme: dark; }
html, body { background: var(--bg); color: var(--text); }
body { font-family: var(--font); margin: 0; }
.wrap { max-width: 1180px; margin: 0 auto; padding-block: 20px 28px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1 { font-family: var(--display); font-weight: 400; font-size: clamp(38px, 6vw, 60px); line-height: 1; margin: 0 0 6px; text-wrap: balance; }
.sub { color: var(--muted); margin: 0 0 16px; max-width: 70ch; }
.styles { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; margin-bottom: 14px; }
.st { text-align: left; cursor: pointer; padding: 10px 12px 12px; border-radius: 8px; background: var(--panel); border: 2px solid #120c1c; box-shadow: inset 0 0 0 1px var(--edge); color: var(--text); font: inherit; min-width: 0; }
.st b { display: block; font-size: 16px; margin-bottom: 4px; }
.st span { font-size: 13px; color: var(--muted); }
.st[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--gold); }
.st:focus-visible, .tog:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.bar { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
.tog { cursor: pointer; font: inherit; color: var(--text); background: var(--panel); border: 2px solid #120c1c; box-shadow: inset 0 0 0 1px var(--edge); border-radius: 6px; padding: 6px 14px; }
.tog[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--gold); color: var(--gold); }
canvas { width: 100%; max-width: 100%; height: auto; image-rendering: pixelated; display: block; border-radius: 10px; border: 2px solid #120c1c; }
.cap { color: var(--muted); font-size: 14px; margin-top: 8px; }
</style>
<div class="wrap">
<h1>Pick a building style</h1>
<p class="sub">The same Hollowmere street drawn five ways: a turreted townhouse, the Gilded Owl tavern, and a chapel with a rose window and spire. Try day and night: windows, stained glass and lanterns light up after dark.</p>
<div class="styles" id="styles"></div>
<div class="bar"><button class="tog" id="day" aria-pressed="true">Day</button><button class="tog" id="night" aria-pressed="false">Night</button></div>
<canvas id="scene" width="1140" height="570"></canvas>
<p class="cap" id="cap"></p>
</div>
<script>
// Nightvale — Gothic building generator: steep fish-scale roofs, cross gables, turrets and spires,
// lancet & rose windows with stained glass, buttresses, gargoyles, timber jetties, leaning facades.
// Self-contained (own pixel painter) so it can also run in previews. Defines window.GothicArt.
(function () {
  'use strict';

  // ------------------------------------------------------------------ painter
  function hash(x, y, s) {
    let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) + Math.imul((s | 0) + 1, 1442695041)) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16; return (h >>> 0) / 4294967296;
  }
  function noise(x, y, s) {
    const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi, u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    const a = hash(xi, yi, s), b = hash(xi + 1, yi, s), c = hash(xi, yi + 1, s), d = hash(xi + 1, yi + 1, s);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  }
  const hexCache = new Map();
  function rgb(c) { if (Array.isArray(c)) return c; let v = hexCache.get(c); if (!v) { const n = parseInt(c.slice(1), 16); v = [(n >> 16) & 255, (n >> 8) & 255, n & 255]; hexCache.set(c, v); } return v; }
  function pack(c, a) { c = rgb(c); return (((a === undefined ? 255 : a) << 24) | (c[2] << 16) | (c[1] << 8) | c[0]) >>> 0; }
  function mixc(a, b, t) { a = rgb(a); b = rgb(b); return [Math.round(a[0] + (b[0] - a[0]) * t), Math.round(a[1] + (b[1] - a[1]) * t), Math.round(a[2] + (b[2] - a[2]) * t)]; }

  class Pix {
    constructor(w, h) { this.w = w | 0; this.h = h | 0; this.d = new Uint32Array(this.w * this.h); this.tag = new Uint8Array(this.w * this.h); }
    set(x, y, c, a, tag) { x = Math.round(x); y = Math.round(y); if (x < 0 || y < 0 || x >= this.w || y >= this.h || c == null) return; const i = y * this.w + x; this.d[i] = pack(c, a); this.tag[i] = tag || 0; }
    has(x, y) { return x >= 0 && y >= 0 && x < this.w && y < this.h && (this.d[y * this.w + x] >>> 24) > 0; }
    rect(x, y, w, h, c) { for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) this.set(x + i, y + j, c); }
    hline(x0, x1, y, c) { for (let x = Math.min(x0, x1); x <= Math.max(x0, x1); x++) this.set(x, y, c); }
    vline(x, y0, y1, c) { for (let y = Math.min(y0, y1); y <= Math.max(y0, y1); y++) this.set(x, y, c); }
    line(x0, y0, x1, y1, c) {
      x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
      const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1; let e = dx + dy;
      for (;;) { this.set(x0, y0, c); if (x0 === x1 && y0 === y1) break; const e2 = 2 * e; if (e2 >= dy) { e += dy; x0 += sx; } if (e2 <= dx) { e += dx; y0 += sy; } }
    }
    disc(cx, cy, rx, ry, c) { for (let y = -Math.ceil(ry); y <= ry; y++) for (let x = -Math.ceil(rx); x <= rx; x++) if ((x * x) / (rx * rx + 0.01) + (y * y) / (ry * ry + 0.01) <= 1) this.set(cx + x, cy + y, c); }
    shade(x, y, t) { // darken an existing pixel toward the outline colour
      if (!this.has(x, y)) return; const i = y * this.w + x, v = this.d[i];
      const c = [v & 255, (v >>> 8) & 255, (v >>> 16) & 255], m = mixc(c, '#120c1c', t); this.d[i] = pack(m, v >>> 24) ; }
    outline(c) {
      const add = [];
      for (let y = 0; y < this.h; y++) for (let x = 0; x < this.w; x++) {
        if (this.has(x, y)) continue;
        if (this.has(x - 1, y) || this.has(x + 1, y) || this.has(x, y - 1) || this.has(x, y + 1)) add.push(x, y);
      }
      for (let i = 0; i < add.length; i += 2) this.set(add[i], add[i + 1], c);
    }
    clone() { const p = new Pix(this.w, this.h); p.d.set(this.d); p.tag.set(this.tag); return p; }
    shear(lean) { // lean the top of the image to the right by `lean` px (crooked buildings)
      if (!lean) return;
      const n = new Uint32Array(this.d.length), t = new Uint8Array(this.d.length);
      for (let y = 0; y < this.h; y++) {
        const k = 1 - y / (this.h - 1), dx = Math.round(lean * Math.pow(k, 1.35));
        for (let x = 0; x < this.w; x++) { const sx = x - dx; if (sx < 0 || sx >= this.w) continue; n[y * this.w + x] = this.d[y * this.w + sx]; t[y * this.w + x] = this.tag[y * this.w + sx]; }
      }
      this.d = n; this.tag = t;
    }
    canvas() {
      const c = document.createElement('canvas'); c.width = this.w; c.height = this.h;
      const x = c.getContext('2d'), img = x.createImageData(this.w, this.h);
      new Uint32Array(img.data.buffer).set(this.d); x.putImageData(img, 0, 0); return c;
    }
  }

  // ------------------------------------------------------------------ styles
  const OUT = '#120c1c';
  const STYLES = {
    crooked: {
      name: 'Hogsmeade Crooked', blurb: 'Leaning timber-and-plaster houses with jettied upper floors, crooked chimneys and indigo fish-scale roofs. Warm, cosy, a little wonky.',
      wall: 'timber', plaster: ['#4b3f4c', '#6c5d6c', '#8f7f8b', '#b2a2a8', '#d2c4c2'], timber: ['#1e1518', '#2e2124', '#45322f'],
      stone: ['#2d2b3a', '#45435a', '#605e78', '#7e7c97', '#9e9cb6', '#c0bed2'], roof: ['#100e20', '#1a1733', '#26224a', '#343062', '#46417e'], scales: true,
      trim: ['#1e1518', '#3e2d2b', '#574039'], metal: ['#2a2733', '#6a6680'], glass: 'warm', lean: 4, jetty: true, crooked: true, gargoyles: false, crest: false,
    },
    cathedral: {
      name: 'Cathedral Gothic', blurb: 'Dark weathered stone, buttresses, gargoyles, iron cresting and blazing stained glass. Grand and sacred, like an old cathedral town.',
      wall: 'stone', stone: ['#17151f', '#24212f', '#332f42', '#454057', '#5b5571', '#77708f'], roof: ['#0e0e16', '#161624', '#212134', '#2d2d46', '#3c3c5c'], scales: false,
      trim: ['#17151f', '#332f42', '#5b5571'], metal: ['#14121c', '#4a4660'], glass: 'stained', lean: 0, jetty: false, gargoyles: true, crest: true, buttress: true,
    },
    moonstone: {
      name: 'Moonstone Gothic', blurb: 'Pale moonstone walls, verdigris-teal slate, silver trims and crescent finials, with cool blue and violet glass. Elegant and ethereal.',
      wall: 'stone', stone: ['#4a4c64', '#6b6e88', '#9194ae', '#b4b7cf', '#d3d6e8', '#eef0fa'], roof: ['#10282f', '#183a44', '#22505c', '#2f6a77', '#448795'], scales: true,
      trim: ['#3a3d55', '#8a8fa8', '#c8cce0'], metal: ['#8a8fa8', '#e8eeff'], glass: 'cool', lean: 0, jetty: false, gargoyles: false, crest: true, moonFinial: true,
    },
    witchwood: {
      name: 'Witchwood Gothic', blurb: 'Black timber, plum roofs gone mossy, twisted spires and windows glowing witch-green. Spooky-cosy, lanterns everywhere.',
      wall: 'timber', plaster: ['#2a2230', '#3a2f40', '#4b3e52', '#5e4f66', '#73637b'], timber: ['#0c090e', '#18121a', '#261c28'],
      stone: ['#1c1a24', '#2b2836', '#3b374a', '#4e495f', '#645e78', '#7c7592'], roof: ['#150b18', '#231226', '#341b38', '#47264c', '#5d3262'], scales: true, mossy: true,
      trim: ['#0c090e', '#261c28', '#3b2b3e'], metal: ['#1a1620', '#3fd88a'], glass: 'witch', lean: 3, jetty: true, crooked: true, twisted: true, gargoyles: false, crest: false,
    },
    victorian: {
      name: 'Victorian Gothic Revival', blurb: 'Dark red brick, cream stone dressings, verdigris copper roofs, iron cresting and tall chimneys. A wizarding-London feel.',
      wall: 'brick', brick: ['#2e1418', '#45202a', '#5e2c34', '#7a3a3e', '#95504c'], stone: ['#4a4440', '#6e675f', '#958c80', '#b9ae9c', '#d8ceb8', '#efe6d2'],
      roof: ['#0f2a26', '#163c36', '#1f5048', '#2b675c', '#3e8274'], scales: true,
      trim: ['#3a3430', '#958c80', '#d8ceb8'], metal: ['#15141a', '#4a4858'], glass: 'stained', lean: 0, jetty: false, gargoyles: true, crest: true,
    },
  };
  const GLASS = {
    warm: { day: ['#1b2246', '#2a3a6a', '#4a64a0', '#8aa8d8'], night: ['#b06a2a', '#ffbc62', '#ffd690', '#fff1c8'] },
    witch: { day: ['#13241f', '#1f3a33', '#2f5a4c', '#5a8a78'], night: ['#1f6a4a', '#3fd88a', '#8affc0', '#e0ffe8'] },
    cool: { day: ['#16243e', '#22385e', '#36568a', '#7a9cc8'], night: ['#3a6ad0', '#5cc8ff', '#a8e6ff', '#f0faff'], mosaic: ['#5cc8ff', '#8f6cff', '#5dffd0', '#b9a0ff', '#e4d2ff'] },
    stained: { day: ['#1a1830', '#2a2448', '#3e3466', '#6a5a98'], night: ['#802070', '#ff4fa8', '#ffd24f', '#ffffff'], mosaic: ['#ff4fa8', '#4fb4ff', '#ffd24f', '#8f6cff', '#4fffc8', '#ff7a4f', '#ff6fd0'] },
  };

  // ------------------------------------------------------------------ materials
  function wallFill(P, x0, y0, w, h, st, seed, mat, opts) {
    opts = opts || {};

      const lx = x - x0, ly = y - y0;
      let c;
      if (mat === 'stone') {
        const course = Math.floor(ly / 5), off = (course % 2) * 4, bx = Math.floor((lx + off) / 8);
        const s = st.stone;
        if (ly % 5 === 4 || (lx + off) % 8 === 0) c = s[1];
        else { const hv = hash(bx, course, seed); c = s[hv < 0.25 ? 2 : hv < 0.8 ? 3 : 4]; if (ly % 5 === 0) c = s[Math.min(s.length - 1, (hv < 0.25 ? 2 : 3) + 1)]; }
        if (hash(x, y, seed + 3) < 0.04) c = s[1];
      } else if (mat === 'brick') {
        const course = Math.floor(ly / 3), off = (course % 2) * 3;
        const b = st.brick;
        if (ly % 3 === 2 || (lx + off) % 6 === 0) c = st.stone[1];
        else { const hv = hash(Math.floor((lx + off) / 6), course, seed); c = b[hv < 0.3 ? 2 : hv < 0.85 ? 3 : 4]; }
      } else if (mat === 'boards') {
        const b = Math.floor(lx / 4); c = st.timber[lx % 4 === 0 ? 0 : hash(b, 3, seed) < 0.5 ? 1 : 2];
      } else { // plaster with timber framing
        const p = st.plaster;
        c = p[noise(x / 5, y / 5, seed) > 0.62 ? 2 : 3];
        if (hash(x, y, seed + 1) < 0.06) c = p[2];
      }
      P.set(x, y, c);
    }
    if (mat === 'timber' || mat === 'plaster') {
      const t = st.timber;
      // frame: posts, rails and braces
      const posts = opts.posts || [];
      P.hline(x0, x0 + w - 1, y0, t[1]); P.hline(x0, x0 + w - 1, y0 + 1, t[0]); P.hline(x0, x0 + w - 1, y0 + h - 1, t[1]);
      P.vline(x0, y0, y0 + h - 1, t[2]); P.vline(x0 + w - 1, y0, y0 + h - 1, t[0]);
      for (const px of posts) { P.vline(x0 + px, y0, y0 + h - 1, t[1]); P.vline(x0 + px + 1, y0, y0 + h - 1, t[0]); }
      if (opts.braces) for (const [bx0, bx1] of opts.braces) P.line(x0 + bx0, y0 + h - 2, x0 + bx1, y0 + 2, t[1]);
      if (opts.rail != null) P.hline(x0, x0 + w - 1, y0 + opts.rail, t[1]);
    }
  }
  function scalesRoof(P, x0, y, w, st, seed, k, kind) {
    // one row of a roof at height y spanning x0..x0+w-1; k = row index from the ridge
    const r = st.roof;
    for (let x = x0; x < x0 + w; x++) {
      let c;
      if (st.scales) {
        const row = Math.floor(k / 3), off = (row % 2) * 2, cell = (x - x0 + off) % 4, sub = k % 3;
        c = r[sub === 2 ? (cell === 1 || cell === 2 ? 2 : 0) : sub === 0 && cell === 1 ? 3 : 2];
      } else {
        const row = Math.floor(k / 3), off = (row % 2) * 3;
        c = r[k % 3 === 2 ? 1 : (x - x0 + off) % 6 === 0 ? 1 : hash(x, row, seed) < 0.18 ? 3 : 2];
      }
      if (st.mossy && noise(x / 4, y / 3, seed + 9) > 0.66) c = hash(x, y, seed) < 0.5 ? '#2f5a36' : '#3b6e42';
      P.set(x, y, c);
    }
  }

  // ------------------------------------------------------------------ openings
  // pointed (lancet) window; returns nothing, records glass pixels with tag 1
  function lancet(P, x, y, w, h, st, seed, opts) {
    opts = opts || {};
    const hw = (w - 1) / 2, archH = Math.max(2, Math.round(hw + 2));
    const inside = (i, j) => { if (j < 0 || j >= h || i < 0 || i >= w) return false; if (j >= archH) return true; const half = hw * Math.sqrt(j / archH); return Math.abs(i - hw) <= half + 0.35; };
    const tr = st.trim;
    for (let j = -1; j <= h; j++) for (let i = -1; i <= w; i++) {
      if (inside(i, j)) continue;
      if (inside(i - 1, j) || inside(i + 1, j) || inside(i, j - 1) || inside(i, j + 1) || (j === h && i >= 0 && i < w)) P.set(x + i, y + j, j === h ? tr[2] : tr[i < hw ? 1 : 0]);
    }
    const g = GLASS[opts.glass || st.glass];

  function rose(P, cx, cy, r, st, seed) {
    const g = GLASS[st.glass === 'warm' ? 'stained' : st.glass], s = st.stone || st.trim;

      const d = Math.hypot(x, y);
      if (d > r + 1.2) continue;
      if (d > r - 0.6) { P.set(cx + x, cy + y, s[d > r + 0.4 ? 1 : 4]); continue; }
      const a = Math.atan2(y, x), seg = Math.floor(((a + Math.PI) / (Math.PI * 2)) * 8);
      const spoke = Math.abs(Math.sin(a * 4)) < 0.18 && d > 1.5;

  function door(P, x, y, w, h, st, seed) { // pointed arch door; (x,y) = top-left of the opening
    const hw = (w - 1) / 2, archH = Math.round(hw + 2);
    const inside = (i, j) => { if (j < 0 || j >= h || i < 0 || i >= w) return false; if (j >= archH) return true; return Math.abs(i - hw) <= hw * Math.sqrt(j / archH) + 0.35; };

      if (inside(i, j)) continue;

      if (near) P.set(x + i, y + j, (Math.floor((i + j + 20) / 2) % 2) ? s[s.length - 2] : s[s.length - 3]);

    for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) {
      if (!inside(i, j)) continue;

      P.set(x + i, y + j, c);

    for (const j of [Math.round(h * 0.35), Math.round(h * 0.75)]) for (let i = 1; i < w - 1; i += 3) P.set(x + i, y + j, '#6a6680');
    P.hline(x - 2, x + w + 1, y + h, s[s.length - 2]); P.hline(x - 2, x + w + 1, y + h + 1, s[2]);
  }
  function roundWin(P, cx, cy, r, st, seed) {
    for (let y = -r - 1; y <= r + 1; y++) for (let x = -r - 1; x <= r + 1; x++) {
      const d = Math.hypot(x, y); if (d > r + 1) continue;
      if (d > r - 0.3) P.set(cx + x, cy + y, st.trim[1]);
      else if (x === 0 || y === 0) P.set(cx + x, cy + y, st.trim[0]);
      else P.set(cx + x, cy + y, GLASS[st.glass].day[x + y < 0 ? 2 : 1], 255, 1);
    }
  }

  // ------------------------------------------------------------------ roof pieces
  // side-gabled main roof: trapezoid from ridge (top) to eave (bottom)
  function mainRoof(P, x0, x1, top, eave, st, seed, steep) {
    const rows = eave - top, inset = Math.round(rows * (steep || 0.3));
    for (let y = top; y <= eave; y++) {
      const k = y - top, ins = Math.round(inset * (1 - k / rows));
      scalesRoof(P, x0 + ins, y, x1 - x0 - 2 * ins + 1, st, seed, k);
      // hip shading: lighter left end, darker right end
      for (let x = x0 + ins; x < x0 + ins + 3; x++) P.shade(x, y, -0.0);
      P.set(x0 + ins, y, st.roof[3]); P.set(x1 - ins, y, st.roof[0]);
    }
    P.hline(x0 + inset, x1 - inset, top, st.roof[4]);
    P.hline(x0 - 1, x1 + 1, eave, st.trim[1]); P.hline(x0 - 1, x1 + 1, eave + 1, st.trim[0]);
    if (st.crest) for (let x = x0 + inset + 2; x < x1 - inset - 1; x += 3) { P.set(x, top - 1, st.metal[0]); if ((x / 3) % 2 < 1) P.set(x, top - 2, st.metal[1]); }
